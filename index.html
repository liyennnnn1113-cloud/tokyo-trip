<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tokyo Journey - V</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap');
        :root {
            --bg-page: #f7f7f7;
            --primary-blue: #364c84;
            --sky-blue: #95b1ee;
            --light-green: #e7f1a8;
            --text-grey: #707070;
            --light-grey: #f1f1f1;
        }
        body { font-family: 'Noto Sans JP', sans-serif; background-color: var(--bg-page); color: var(--primary-blue); margin: 0; padding-bottom: 120px; overflow-x: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .soft-shadow { box-shadow: 0 10px 30px rgba(54, 76, 132, 0.04); }
        .glass-card { background: white; border-radius: 28px; padding: 24px; border: 1px solid rgba(255,255,255,0.8); }
        .itinerary-card { background: white; border-radius: 28px; padding: 24px; min-height: 110px; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
        .date-card { width: 66px; height: 88px; border-radius: 20px; transition: 0.3s; background: white; flex-shrink: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0.5; margin: 0 6px; border: 1px solid rgba(0,0,0,0.02); }
        .date-card.active { background-color: var(--light-green) !important; opacity: 1; box-shadow: 0 8px 15px rgba(231, 241, 168, 0.4); transform: scale(1.05); border: none; }
        .nav-btn { color: #CCCCCC; text-align: center; font-size: 11px; flex: 1; border: none; background: none; outline: none; transition: 0.3s; }
        .nav-btn.active { color: var(--primary-blue) !important; font-weight: bold; }
        .category-tag { font-size: 10px; font-weight: bold; padding: 4px 10px; border-radius: 8px; background: #f1f1f1; color: var(--primary-blue); }
        .check-item { display: flex; align-items: center; gap: 12px; font-size: 14px; margin-bottom: 12px; color: var(--text-grey); }
        .check-item i { color: var(--sky-blue); font-size: 16px; }
        .embedded-box { background-color: #fcfbf7; border: 1px dashed rgba(54, 76, 132, 0.15); border-radius: 16px; padding: 14px; margin-top: 10px; }
        .clickable-link { text-decoration: underline; color: #4a6fa5; font-weight: 500; cursor: pointer; }
        .clickable-link:active { opacity: 0.6; }
        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

                    <div class="h-10 w-px bg-gray-100"></div>

                </div>
            </div>
        </div>

        let currentDayIdx = 1;
        const el = (id) => document.getElementById(id);

        function switchTab(tab) {
            ['dash', 'itinerary', 'expense'].forEach(s => {
                const section = el(s + 'Section');
                const btn = el('btn-' + s.substring(0, 3));
                if(section) section.classList.add('hidden');
                if(btn) btn.classList.remove('active');
            });
            const target = el(tab + 'Section');
            const targetBtn = el('btn-' + tab.substring(0, 3));
            if(target) target.classList.remove('hidden');
            if(targetBtn) targetBtn.classList.add('active');
            if(el('pageTitle')) el('pageTitle').innerText = tab==='dash'?'總覽':(tab==='itinerary'?'行程':'支出');
            if(tab === 'expense') renderExpenses('date');
        }

        function setDay(i) {
            currentDayIdx = i;
            if(el('itiDateTitle')) el('itiDateTitle').innerText = dates[i].full;
            if(el('dayOverviewText')) el('dayOverviewText').innerText = dates[i].summary;
            renderDates();
            renderPlans();
        }

            const nav = el('dateNav');
            if(!nav) return;

                <div onclick="setDay(${i})" class="date-card soft-shadow ${i === currentDayIdx ? 'active' : ''}">
                    <span class="text-[10px] mb-1 font-bold uppercase">${d.w}</span>
                    <span class="text-lg font-bold">${d.d}</span>
                </div>
            `).join('');
        }

        function renderPlans() {
            const list = el('planList');
            if(!list) return;
            const dayPlans = (plans[currentDayIdx] || []).sort((a,b) => a.time.localeCompare(b.time));
            
            list.innerHTML = dayPlans.map((p) => {
                if (p.cat === '🚗 移動') {
                    return `
                        <div class="flex flex-col items-center my-2 px-1 fade-in">
                            <div class="flex items-center gap-3 bg-white/90 backdrop-blur-sm border border-gray-100 soft-shadow px-5 py-3 rounded-2xl w-full justify-between">
                                <div class="flex items-center gap-3">
                                    <span class="text-[10px] font-bold text-white px-2 py-0.5 rounded-lg bg-[var(--sky-blue)] flex items-center gap-1"><i class="fas fa-clock text-[9px]"></i> ${p.transit || '移動'}</span>
                                    <span class="text-xs font-bold text-[var(--primary-blue)]">${p.loc}</span>
                                </div>
                                ${p.map ? `
                                <button onclick="window.open('${p.map}')" class="text-[var(--primary-blue)] p-1 hover:scale-110 active:scale-95 transition-transform flex items-center justify-center">
                                    <svg class="w-4 h-4 text-[var(--primary-blue)]" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M22 2L2 10.5L11.5 13L14 22.5L22 2Z"/>
                                    </svg>
                                </button>` : ''}
                            </div>
                            ${p.desc ? `<p class="text-[11px] text-[var(--text-grey)] text-left mt-1.5 px-4 leading-relaxed whitespace-pre-line w-full opacity-80">${p.desc}</p>` : ''}
                            ${p.twd > 0 ? `<p class="text-[10px] font-bold text-[var(--sky-blue)] mt-1 w-full px-4 text-left">台幣支出: NT$ ${Math.round(p.twd).toLocaleString()}</p>` : ''}
                        </div>
                    `;
                } else {
                    let embedHtml = '';
                    if (p.embedType === 'breakfast') {
                        embedHtml = `
                            <div class="embedded-box">
                                <p class="text-[11px] font-bold opacity-60 mb-2"><i class="fas fa-utensils mr-1"></i> 早餐選項點擊導航：</p>
                                <div class="flex flex-wrap gap-x-4 gap-y-2 text-xs">
                                    <span class="clickable-link" onclick="window.open('https://maps.app.goo.gl/rhoFmkeJiB8Ly3Yi9')">麥當勞</span>
                                    <span class="clickable-link" onclick="window.open('https://maps.app.goo.gl/zgvjR7BpzaKJpJQJA')">三明治</span>
                                    <span class="clickable-link" onclick="window.open('https://maps.app.goo.gl/LY4ZVEjtGLwkygAd7')">漢堡</span>
                                </div>
                            </div>
                        `;
                    } else if (p.embedType === 'lunch') {
                        embedHtml = `
                            <div class="embedded-box">
                                <p class="text-[11px] font-bold opacity-60 mb-2"><i class="fas fa-store mr-1"></i> 小町通必吃午餐導航：</p>
                                <div class="flex flex-wrap gap-x-4 gap-y-2 text-xs">
                                    <span class="clickable-link" onclick="window.open('https://maps.app.goo.gl/u7zY5TE8iL6g12N59')">咖哩麵包</span>
                                    <span class="clickable-link" onclick="window.open('https://maps.app.goo.gl/4g8KQxtNZu7F2y5eA')">大佛燒</span>
                                    <span class="clickable-link" onclick="window.open('https://maps.app.goo.gl/NMNumbiLgoEt2QPLA')">鎌倉釜飯</span>
                                </div>
                            </div>
                        `;
                    } else if (p.embedType === 'hotel_guide') {
                        embedHtml = `
                            <div class="embedded-box">
                                <p class="text-[11px] font-bold opacity-60 mb-2"><i class="fas fa-book-open mr-1"></i> 入住指南 (點開照片)：</p>
                                <div class="mb-3 cursor-pointer" onclick="window.open('https://i.postimg.cc/1t32Ts1D/qian-cao-min-su.png')">
                                    <img src="https://i.postimg.cc/1t32Ts1D/qian-cao-min-su.png" class="rounded-lg w-full h-32 object-cover border border-gray-200" alt="入住指南">
                                </div>
                                <div class="flex flex-col gap-2 text-xs">
                                    <span class="clickable-link" onclick="window.open('https://tremendous-pudding-6fc.notion.site/202-Welcome-Guide-31faef181c27805c867accfc3c46d596')"><i class="fas fa-external-link-alt"></i> 步驟教學 (Notion)</span>
                                    <span class="clickable-link" onclick="window.open('https://tremendous-pudding-6fc.notion.site/Check-in-Process-ee6fd71125d14c26a74a95999d8e3cf2')"><i class="fas fa-tablet-alt"></i> 平板教學 (Notion)</span>
                                </div>
                            </div>
                        `;
                    }

                    return `
                        <div class="itinerary-card soft-shadow fade-in">
                            <div>
                                <div class="flex justify-between items-start mb-3">
                                    <div class="flex items-center space-x-2"><span class="category-tag">${p.cat}</span><span class="text-xs opacity-50 font-bold">${p.time}</span></div>
                                    ${p.map ? `<button onclick="window.open('${p.map}')" class="text-[var(--sky-blue)]"><i class="fas fa-location-dot text-lg"></i></button>` : ''}
                                </div>
                                <h3 class="font-bold text-lg mb-1 text-[var(--primary-blue)]">${p.loc}</h3>
                                ${p.desc ? `<p class="text-xs text-[var(--text-grey)] leading-relaxed whitespace-pre-line">${p.desc}</p>` : ''}
                                ${embedHtml}
                            </div>
                            ${p.twd > 0 ? `<div class="mt-4 text-[11px] font-black text-[var(--sky-blue)] flex justify-between border-t border-gray-50 pt-3"><span>台幣支出</span><span>NT$ ${Math.round(p.twd).toLocaleString()}</span></div>` : ''}
                        </div>
                    `;
                }
            }).join('');
        }

        function renderExpenses(mode) {
            const list = el('expenseList');
            let total = 0;
            let html = '';
            el('btnStatDate').className = mode==='date' ? 'flex-1 py-3 rounded-2xl bg-[var(--primary-blue)] text-white text-xs font-bold soft-shadow' : 'flex-1 py-3 rounded-2xl bg-white text-[var(--primary-blue)] text-xs font-bold soft-shadow';
            el('btnStatCat').className = mode==='cat' ? 'flex-1 py-3 rounded-2xl bg-[var(--primary-blue)] text-white text-xs font-bold soft-shadow' : 'flex-1 py-3 rounded-2xl bg-white text-[var(--primary-blue)] text-xs font-bold soft-shadow';

            if (mode === 'date') {
                Object.keys(plans).forEach(day => {
                    const dayItems = plans[day].filter(p => p.twd > 0);
                    if(dayItems.length > 0) {
                        let dayTotal = dayItems.reduce((sum, item) => sum + item.twd, 0);
                        html += `<div class="mb-2"><h4 class="text-[11px] font-black opacity-30 mb-2 uppercase tracking-widest">Day ${dates[day].d} (${dates[day].full}) - Total: NT$ ${Math.round(dayTotal).toLocaleString()}</h4>`;
                        dayItems.forEach(p => { html += `<div class="glass-card soft-shadow flex justify-between items-center py-4 mb-2"><div><span class="category-tag !bg-[#f7f7f7] mr-2">${p.cat}</span><span class="text-sm font-bold">${p.loc}</span></div><p class="font-bold text-sm">NT$ ${Math.round(p.twd).toLocaleString()}</p></div>`; });
                        html += `</div>`;
                    }
                });
            } else {
                const categories = ['🚗 移動', '🧁 吃喝', '🛍️ 購物', '🏖️ 景點', '🏠 住宿'];
                const catStats = {};
                categories.forEach(c => catStats[c] = { total: 0, items: [] });
                Object.keys(plans).forEach(day => {
                    plans[day].forEach(p => {
                        let standardCat = p.cat;
                        if (standardCat === '🏡 住宿') standardCat = '🏠 住宿';
                        if (standardCat === '⛱️ 景點' || standardCat === '巢 景點') standardCat = '🏖️ 景點';
                        if(p.twd > 0 && catStats[standardCat]) {
                            catStats[standardCat].total += p.twd;
                            catStats[standardCat].items.push({...p, dayLabel: dates[day].d});
                        }
                    });
                });
                categories.forEach(c => {
                    if(catStats[c].total > 0) {
                        html += `<div class="mb-2"><h4 class="text-[11px] font-black opacity-30 mb-2 uppercase tracking-widest">${c} 總支出 - Total: NT$ ${Math.round(catStats[c].total).toLocaleString()}</h4>`;
                        catStats[c].items.forEach(item => { html += `<div class="glass-card soft-shadow flex justify-between items-center py-4 mb-2"><div><span class="text-[9px] opacity-40 mr-2">DAY ${item.dayLabel}</span><span class="text-sm font-bold">${item.loc}</span></div><p class="font-bold text-sm">NT$ ${Math.round(item.twd).toLocaleString()}</p></div>`; });
                        html += `</div>`;
                    }
                });
            }
            Object.values(plans).flat().forEach(p => total += (p.twd || 0));
            el('totalCostDisplay').innerText = `NT$ ${Math.round(total).toLocaleString()}`;
            el('dashTotalExp').innerText = `NT$ ${Math.round(total).toLocaleString()}`;
            list.innerHTML = html || '<p class="text-center opacity-20 py-10">尚無紀錄</p>';
        }

        setDay(1); switchTab('dash');
    </script>
</body>
</html>
